<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-title" content="江璿物理">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
<title>江璿物理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --font:"PingFang TC","Microsoft JhengHei","Noto Sans TC",-apple-system,system-ui,"Segoe UI",sans-serif;
  --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F6F7F9; --surface-3:#EDEFF2;
  --ink:#1A1D24; --ink-soft:#5A616B; --ink-faint:#8C93A0;
  --line:#E7E9ED; --line-strong:#D4D8DE;
  --accent:#0D9488; --today:#0D9488;
  --crit:#DC2626; --holiday:#D97706;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){:root{
  --paper:#16181C; --surface:#1E2126; --surface-2:#262A30; --surface-3:#2F343B;
  --ink:#E8EAED; --ink-soft:#A9B0BA; --ink-faint:#737B86;
  --line:#2C3037; --line-strong:#3A3F47; --accent:#2DD4BF; --today:#14B8A6;
  --crit:#F87171; --holiday:#FBBF24;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.tnum{font-variant-numeric:tabular-nums}
.wrap{padding:clamp(14px,3vw,32px);max-width:1120px;margin:0 auto;padding-bottom:90px}

.head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}
.brand h1{font-size:clamp(1.7rem,5vw,2.4rem);margin:0;font-weight:800;letter-spacing:.01em}
.brand .sub{color:var(--ink-soft);font-size:.78rem;margin-top:3px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.sem{display:inline-flex;align-items:center;gap:8px;margin-top:10px}
.sem .lbl{font-size:.66rem;color:var(--ink-faint);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.sem select{font-family:inherit;font-size:.9rem;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px}
.hstats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 14px;box-shadow:var(--shadow);min-width:92px}
.stat .k{font-size:.64rem;color:var(--ink-faint);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.stat .v{font-size:1.2rem;font-weight:800;margin-top:2px}
.stat .v small{font-size:.7rem;color:var(--ink-soft);font-weight:600}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1.5px solid var(--line);margin-bottom:18px;scrollbar-width:thin}
.tab{appearance:none;background:none;border:none;font-family:inherit;cursor:pointer;white-space:nowrap;color:var(--ink-soft);font-size:.92rem;font-weight:700;padding:10px 13px;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.panel{display:none}.panel.on{display:block}

.calbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.calbar h2{margin:0;font-size:1.2rem;font-weight:800}
.nav{display:flex;gap:6px}
.nav button,.today-btn,.btn{appearance:none;font-family:inherit;cursor:pointer;background:var(--surface);border:1px solid var(--line-strong);color:var(--ink);border-radius:8px;padding:7px 12px;font-weight:700;font-size:.88rem}
.nav button:disabled{opacity:.4}
.hint{font-size:.76rem;color:var(--ink-faint);margin:0 0 10px}
.cal-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.cal{min-width:720px}
.cal-h,.cal-row{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-h div{padding:8px;text-align:center;font-size:.7rem;font-weight:700;letter-spacing:.06em;color:var(--ink-faint);border-bottom:1px solid var(--line)}
.cal-h div.we{color:var(--accent)}
.cell{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;position:relative;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.cell:hover{background:var(--surface-2)}
.cell:nth-child(7n){border-right:none}
.cell.out{background:var(--surface-2);opacity:.5;cursor:default}
.cell.exam{background:color-mix(in srgb,var(--crit) 12%,var(--surface))}
.cell.holiday{background:color-mix(in srgb,var(--holiday) 13%,var(--surface))}
.cell-head{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-height:20px}
.dnum{font-size:.8rem;font-weight:700;color:var(--ink-soft);padding:0 4px;border-radius:6px}
.cell.today .dnum{background:var(--today);color:#fff}
.cell.exam .dnum{color:var(--crit)}.cell.holiday .dnum{color:var(--holiday)}
.mark{font-size:.6rem;font-weight:700;padding:1px 5px;border-radius:4px}
.mark-exam{color:color-mix(in srgb,var(--crit) 70%,var(--ink));background:color-mix(in srgb,var(--crit) 15%,transparent)}
.day-tag{font-size:.64rem;font-weight:700;padding:2px 6px;border-radius:5px;border-left:3px solid var(--holiday);background:color-mix(in srgb,var(--holiday) 16%,var(--surface));color:color-mix(in srgb,var(--holiday) 62%,var(--ink))}
.chip{font-size:.7rem;line-height:1.25;padding:3px 6px;border-radius:6px;border-left:3px solid var(--sc);background:color-mix(in srgb,var(--sc) 13%,var(--surface));color:var(--ink);font-weight:600}
.chip.cancelled{opacity:.45;text-decoration:line-through}
.chip .pd{font-size:.6rem;color:var(--ink-soft);font-weight:600;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:.8rem;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.dot{width:11px;height:11px;border-radius:3px}

.summary-strip{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.summary-strip .s-item{flex:1;min-width:140px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 15px;box-shadow:var(--shadow)}
.summary-strip .k{font-size:.66rem;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.summary-strip .v{font-size:1.4rem;font-weight:800;margin-top:2px}
.moneycard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.mc-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.mc-h h3{margin:0;font-size:1.08rem;font-weight:800}
.mc-tot{font-size:1.2rem;font-weight:800}.mc-tot small{font-size:.7rem;color:var(--ink-soft);font-weight:600}
.tbl-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 16px;border-bottom:1px solid var(--line)}
thead th{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.school-tag{display:inline-flex;align-items:center;gap:7px;font-weight:700}
.school-tag::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--sc);flex:none}
.report{border-top:1px solid var(--line)}
.report summary{cursor:pointer;padding:10px 16px;font-size:.84rem;font-weight:700;color:var(--accent);list-style:none;display:flex;align-items:center;gap:8px}
.report summary::-webkit-details-marker{display:none}
.report .tri{transition:transform .15s}.report[open] .tri{transform:rotate(90deg)}
.report .rbody{padding:0 16px 14px}
.report pre{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-family:var(--font);font-size:.8rem;line-height:1.7;white-space:pre-wrap;margin:0 0 8px}
.copy-btn{appearance:none;font-family:inherit;cursor:pointer;background:transparent;border:1.5px solid var(--accent);color:var(--accent);border-radius:7px;padding:5px 13px;font-weight:700;font-size:.8rem}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);border-top:3px solid var(--sc);overflow:hidden}
.pcard summary{list-style:none;cursor:pointer;padding:14px 16px;position:relative;display:block}
.pcard summary::-webkit-details-marker{display:none}
.pc-tri{position:absolute;top:15px;right:14px;color:var(--ink-faint);transition:transform .15s}
.pcard[open] .pc-tri{transform:rotate(90deg)}
.pc-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-right:22px}
.pc-head h3{margin:0;font-size:1.02rem;font-weight:800}
.pc-when{font-size:.74rem;color:var(--ink-faint);font-weight:600}
.next{margin-top:10px;background:color-mix(in srgb,var(--accent) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);border-radius:9px;padding:8px 11px;font-size:.88rem;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.next .nd{font-weight:800;color:var(--accent);white-space:nowrap}
.next .ntx{flex:1}
.pbody{padding:0 16px 14px}
.log{list-style:none;margin:8px 0 0;padding:0}
.log li{display:flex;gap:9px;padding:7px 0;border-top:1px dashed var(--line);align-items:baseline}
.log li:first-child{border-top:none}
.log .wk{font-size:.72rem;font-weight:700;color:var(--ink-faint);white-space:nowrap;min-width:38px}
.log .tx{flex:1;font-size:.85rem}
.log-empty{margin-top:9px;color:var(--ink-faint);font-style:italic;font-size:.84rem}
.ib{appearance:none;background:none;border:none;cursor:pointer;color:var(--ink-faint);font-size:.9rem;padding:3px 6px;border-radius:8px;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.ib:active{background:var(--surface-2)}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.addrow{margin-top:10px}
.addrow button{appearance:none;font-family:inherit;cursor:pointer;background:transparent;border:1px dashed var(--line-strong);color:var(--accent);border-radius:8px;padding:7px 12px;font-weight:700;font-size:.82rem;width:100%}

.sched-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);background:var(--surface)}
.sched{min-width:640px;border-collapse:collapse;width:100%}
.sched th,.sched td{border:1px solid var(--line);padding:0;text-align:center}
.sched thead th{padding:9px;font-size:.78rem;background:var(--surface-2)}
.sched .period{background:var(--surface-2);font-weight:700;font-size:.8rem;color:var(--ink-soft);width:70px;padding:9px}
.sched .slot{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px;font-size:.8rem;font-weight:700;line-height:1.3}
.sched .slot.filled{background:color-mix(in srgb,var(--sc) 15%,var(--surface));border-left:3px solid var(--sc)}
.sched .slot .note{font-size:.66rem;color:var(--ink-soft);margin-top:2px}

.news-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.badge{font-size:.7rem;font-weight:700;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:3px 11px}
.note-card{appearance:none;width:100%;display:block;text-align:left;font-family:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);border-left:3px solid var(--accent);padding:13px 15px;margin-bottom:11px;cursor:pointer}
.note-card:hover{background:var(--surface-2)}
.note-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note-card .nmeta{font-size:.72rem;color:var(--ink-faint);font-weight:700;margin-bottom:7px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.note-card .nmeta-main{display:flex;gap:8px;align-items:center;min-width:0}
.note-card .ntag{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);border-radius:5px;padding:1px 8px}
.note-card .ntx{font-size:.9rem;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note-card .nsource{margin-top:8px;font-size:.75rem;color:var(--ink-faint);font-weight:700}
.note-card .nmore{font-size:.72rem;color:var(--accent);font-weight:800;white-space:nowrap}
.news-detail{display:grid;gap:13px}
.news-detail .detail-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--ink-faint);font-size:.78rem;font-weight:700}
.news-detail .detail-tag{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);border-radius:5px;padding:2px 8px}
.news-section{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.news-section h4{margin:0 0 5px;font-size:.78rem;color:var(--ink-soft);letter-spacing:.06em;font-weight:800}
.news-section p{margin:0;font-size:.94rem;line-height:1.75}
.news-section ul{margin:8px 0 0 18px;padding:0;display:grid;gap:6px}
.news-section li{font-size:.94rem;line-height:1.7}
.news-section p + p{margin-top:10px}
.source-btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:var(--accent);color:#fff;border-radius:10px;padding:11px 13px;font-size:.92rem;font-weight:800}
.source-host{font-size:.76rem;color:var(--ink-faint);font-weight:700}

.empty{text-align:center;padding:38px 18px;border:1.5px dashed var(--line-strong);border-radius:var(--radius);color:var(--ink-soft);background:var(--surface)}

.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2);padding:18px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .22s;max-width:560px;margin:0 auto;max-height:88vh;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.sheet h3{margin:0 0 14px;font-size:1.1rem;font-weight:800}
.field{margin-bottom:12px}
.field label{display:block;font-size:.76rem;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:1rem;color:var(--ink);background:var(--paper);border:1px solid var(--line-strong);border-radius:9px;padding:10px 12px}
.field textarea{min-height:70px;resize:vertical}
.sheet-actions{display:flex;gap:9px;margin-top:16px}
.sheet-actions button{flex:1;appearance:none;font-family:inherit;cursor:pointer;border-radius:10px;padding:12px;font-weight:800;font-size:.95rem;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.sheet-actions .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.sheet-actions .danger{background:transparent;border-color:var(--crit);color:var(--crit)}
.sess-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.sess-row:first-child{border-top:none}
.sess-row .info{flex:1}
.sess-row .info b{font-weight:700}
.sess-row .info small{color:var(--ink-soft);display:block;font-size:.76rem}
.sess-row.cancelled .info{opacity:.5;text-decoration:line-through}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper);z-index:80;font-weight:700;color:var(--ink-soft);padding:20px;text-align:center}
footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);color:var(--ink-faint);font-size:.76rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}

/* ===== 手機版（iPhone 直式 ~393px）===== */
@media (max-width:640px){
  .wrap{padding:12px 12px 90px}
  .head{gap:10px;margin-bottom:14px}
  .brand h1{font-size:1.35rem}
  .brand .sub{font-size:.7rem;letter-spacing:.08em}
  .hstats{width:100%}
  .stat{flex:1;min-width:0;padding:7px 12px}
  .tabs{gap:0}
  .tab{padding:9px 11px;font-size:.88rem}

  .calbar{flex-wrap:wrap;gap:8px}
  .calbar h2{font-size:1.05rem}
  .nav button,.today-btn{padding:6px 9px;font-size:.82rem}
  .hint{font-size:.72rem}

  /* 月曆填滿螢幕，不用左右捲 */
  .cal-scroll{overflow-x:visible}
  .cal{min-width:0}
  .cal-h div{padding:5px 1px;font-size:.6rem;letter-spacing:0}
  .cell{min-height:60px;padding:3px 2px;gap:2px}
  .cell-head{gap:2px;flex-wrap:nowrap;overflow:hidden;min-height:15px}
  .dnum{font-size:.72rem;padding:0 2px}
  .mark{font-size:.5rem;padding:0 3px}
  .day-tag{font-size:.52rem;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .chip{display:block;font-size:.56rem;line-height:1.2;padding:2px 3px;border-left-width:3px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip .pd{display:none}
  .legend{gap:9px;font-size:.74rem}

  /* 表格 / 卡片 */
  th,td{padding:7px 10px}
  .mc-h{padding:11px 12px}
  .report summary,.report .rbody{padding-left:12px;padding-right:12px}
  .summary-strip .s-item{min-width:0}
  .grid-cards{grid-template-columns:1fr}

  /* 固定課表：手機填滿螢幕、縮小 */
  .sched-scroll{overflow-x:visible}
  .sched{min-width:0}
  .sched thead th{padding:6px 2px;font-size:.62rem}
  .sched .period{width:40px;padding:6px 2px;font-size:.62rem}
  .sched .slot{min-height:44px;font-size:.6rem;padding:4px 2px;line-height:1.2}
  .sched .slot .note{font-size:.54rem}

  /* 大一點的可點按鈕 */
  .ib{padding:6px 9px;font-size:1.05rem;min-width:34px}
  .pcard summary{padding:14px 14px}
  .pbody{padding:0 14px 14px}
  .sheet{border-radius:16px 16px 0 0}
  .sheet-actions button{padding:13px}
  .note-card{padding:12px 13px}
  .note-card .ntx{-webkit-line-clamp:4}
  .news-section p{font-size:.9rem}
}
</style>
</head>
<body>
<div id="loading" class="loading">載入中…</div>

<div class="wrap" id="app" style="display:none">
  <header class="head">
    <div class="brand">
      <h1>江璿物理</h1>
      <div class="sub">Jiangxuan Physics</div>
      <div class="sem"><span class="lbl">學期</span><select id="semSel"></select></div>
    </div>
    <div class="hstats" id="hstats"></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab" role="tab" data-p="cal">📅 月曆</button>
    <button class="tab" role="tab" data-p="salary">💰 月薪統計</button>
    <button class="tab" role="tab" data-p="progress">📈 課程進度</button>
    <button class="tab" role="tab" data-p="sched">🗓️ 固定課表</button>
    <button class="tab" role="tab" data-p="notes">💡 上課筆記</button>
    <button class="tab" role="tab" data-p="rec">🎙️ 上課錄音</button>
  </nav>

  <section class="panel" id="p-cal" role="tabpanel">
    <div class="calbar">
      <h2 id="calTitle">—</h2>
      <div class="nav"><button id="prevM">‹ 上月</button><button class="today-btn" id="todayM">今天</button><button id="nextM">下月 ›</button></div>
    </div>
    <p class="hint">點任一天可以新增 / 改課 / 停課。</p>
    <div class="cal-scroll"><div class="cal">
      <div class="cal-h"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="we">六</div><div class="we">日</div></div>
      <div id="calBody"></div>
    </div></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="panel" id="p-salary" role="tabpanel">

function renderCalendar(){
  const MIN=2026*12+7,MAX=2027*12+6,idx=viewY*12+viewM;

  document.getElementById("calTitle").textContent=`${viewY} 年 ${viewM} 月`;

/* ===== 月薪 ===== */
function semMonths(sem){ const out=[]; let [y,m]=sem.start_date.split("-").map(Number); const [ey,em]=sem.end_date.split("-").map(Number);

  wrap.querySelectorAll(".copy-btn").forEach(b=>b.onclick=()=>{const t=document.getElementById(b.dataset.c).textContent;

/* ===== 課程進度 ===== */
function progOf(c){ return DB.progress.filter(p=>p.school===c.school&&p.class_name===c.class_name&&((p.track||null)===(c.track||null))); }

function renderNotes(){
  const el=document.getElementById("notesBody");
  const rows=DB.news.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.created_at||"").localeCompare(a.created_at||""));

    card.onclick=()=>openNewsDetail(n);

function openNewsDetail(n){
  const detail=parseNewsContent(n.content);
  const url=safeHttpUrl(n.source_url);
  const title=detail.title||"新聞詳細資料";
  const source=url?`<a class="source-btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">開啟文章連結</a><div class="source-host">${esc(hostLabel(url))}</div>`:`<div class="source-host">沒有文章連結</div>`;
  const sections=detail.sections.map(sec=>`<div class="news-section"><h4>${esc(sec.label)}</h4>${renderNewsSectionContent(sec.content)}</div>`).join("");
  openSheet(esc(title), `<div class="news-detail">
    <div class="detail-meta"><span class="detail-tag">${esc(n.tag||"未分類")}</span><span>${esc(fmtDate(n.date))}</span></div>
    ${sections}
    ${source}
  </div>`);
}

function parseNewsContent(raw){
  const text=String(raw||"").replace(/\r\n/g,"\n").trim();
  const lines=text.split(/\n/).map(s=>s.trim()).filter(Boolean);
  const sections=[];
  let current=null;
  lines.forEach(line=>{
    const m=line.match(/^([^:：]{1,12})[:：]\s*(.*)$/u);
    if(m){
      current={label:m[1].trim(),content:m[2].trim()};
      sections.push(current);
      return;
    }
    if(current){
      current.content=current.content?`${current.content}\n${line}`:line;
    }
  });
  let summary=(sections.find(sec=>["摘要","重點"].includes(sec.label))||{}).content||"";
  if(!summary){
    summary=firstSentence(text,128);
    sections.unshift({label:"摘要",content:summary});
  }
  if(!sections.length){
    sections.push({label:"摘要",content:summary||"這則新聞目前沒有可直接顯示的摘要。"});
    sections.push({label:"內容",content:text||"這則新聞目前沒有更多可顯示內容。"});
  }
  return {
    title:extractNewsTitle(summary)||extractNewsTitle(text),
    summary:summary||"這則新聞目前沒有可直接顯示的摘要。",
    sections,
  };
}
function renderNewsSectionContent(content){
  const blocks=[];
  const lines=String(content||"").split(/\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length)return `<p>目前沒有更多內容。</p>`;
  let paragraphLines=[];
  let listItems=[];
  const flushParagraph=()=>{
    if(!paragraphLines.length)return;
    blocks.push(`<p>${esc(paragraphLines.join(" "))}</p>`);
    paragraphLines=[];
  };
  const flushList=()=>{
    if(!listItems.length)return;
    blocks.push(`<ul>${listItems.map(item=>`<li>${esc(item)}</li>`).join("")}</ul>`);
    listItems=[];
  };
  lines.forEach(line=>{
    const bullet=line.match(/^[-•●▪‣]\s*(.+)$/u)||line.match(/^\d+\.\s*(.+)$/u);
    if(bullet){
      flushParagraph();
      listItems.push(bullet[1].trim());
      return;
    }
    flushList();
    paragraphLines.push(line);
  });
  flushParagraph();
  flushList();
  return blocks.join("")||`<p>${esc(String(content||""))}</p>`;
}
function firstSentence(text,max){
  const clean=String(text||"").replace(/\s+/g," ").trim();
  const m=clean.match(/^(.+?[。！？?])/u);
  const sentence=(m?m[1]:clean).trim();
  return sentence.length>max?sentence.slice(0,max)+"…":sentence;
}

function extractNewsTitle(text){
  const m=String(text||"").match(/「([^」]{4,90})」/u);
  return m?m[1].trim():"";
}

function fmtDate(value){ return value?String(value).replaceAll("-","/"):""; }
function safeHttpUrl(value){ try{ const u=new URL(String(value||"")); return /^https?:$/.test(u.protocol)?u.toString():""; }catch{return "";} }
function hostLabel(value){ try{ return new URL(value).hostname.replace(/^www\./,""); }catch{return "原文來源";} }
function esc(value){ return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch])); }

/* ===== 編輯：課堂 ===== */
function openDaySheet(ds){

async function setSess(id,patch){ const ds=DB.sessions.find(s=>s.id===id).date; const {error}=await sb.from("sessions").update(patch).eq("id",id); if(error)return toast("錯誤:"+error.message); toast("已更新"); await reload(); openDaySheet(ds); }
async function delSess(id){ if(!confirm("確定刪除這堂課?"))return; const ds=DB.sessions.find(s=>s.id===id).date; const {error}=await sb.from("sessions").delete().eq("id",id); if(error)return toast("錯誤:"+error.message); toast("已刪除"); await reload(); openDaySheet(ds); }
function rescheduleSess(id){

function addSess(ds){

    {key:"school",label:"補習班",type:"select",options:DB.schools.map(s=>s.name),value:"龍譽"},

    {key:"price",label:"鐘點費",type:"number",value:2500},

  ],async v=>{ if(!v.class_name)throw new Error("請填班別"); const {error}=await sb.from("sessions").insert({date:ds,school:v.school,class_name:v.class_name,period:v.period,hours:Number(v.hours),price:Number(v.price),location:v.location||null}); if(error)throw error; toast("已新增"); await reload(); openDaySheet(ds); });

function todayISO(){ const t=new Date(); return iso(t.getFullYear(),t.getMonth()+1,t.getDate()); }
function addLesson(school,class_name,track,kind){
  formSheet(kind==="planned"?"設定下一堂":"新增已上課內容",[
    {key:"session_date",label:"日期",type:"date",value:todayISO()},
    {key:"content",label:"上課內容",type:"textarea",value:""},
  ],async v=>{ if(!v.content)throw new Error("請填內容"); const {error}=await sb.from("progress").insert({school,class_name,track:track||null,session_date:v.session_date,content:v.content,kind}); if(error)throw error; toast("已新增"); await reload(); });
}
function editLesson(id){
  const e=DB.progress.find(x=>x.id===id);
  formSheet("編輯內容",[
    {key:"session_date",label:"日期",type:"date",value:e.session_date},
    {key:"content",label:"上課內容",type:"textarea",value:e.content},
    {key:"kind",label:"類型",type:"select",options:["done","planned"],value:e.kind,labels:{done:"已上課",planned:"預計下一堂"}},
  ],async v=>{ const {error}=await sb.from("progress").update({session_date:v.session_date,content:v.content,kind:v.kind}).eq("id",id); if(error)throw error; toast("已更新"); await reload(); },
  async()=>{ const {error}=await sb.from("progress").delete().eq("id",id); if(error)throw error; toast("已刪除"); await reload(); });
}
/* 點「下一堂」：可改內容、或直接完成並排下一堂 */
function editPlanned(id){
  const e=DB.progress.find(x=>x.id===id);
  const ttl=`${e.school} ${e.class_name}${e.track?`（${e.track}）`:""} · 下一堂`;
  const body=`
    <div class="field"><label>日期</label><input type="date" data-k="session_date" value="${e.session_date}"></div>
    <div class="field"><label>授課範圍 / 內容</label><textarea data-k="content">${e.content||""}</textarea></div>
    <div class="sheet-actions" style="flex-wrap:wrap">
      <button class="primary" id="pDone" style="flex:1 1 100%">✅ 完成這堂，接著排下一堂</button>
      <button id="pSave">只儲存修改</button>
      <button id="pCancel">取消</button>
      <button class="danger" id="pDel" style="flex:1 1 100%">刪除這筆</button>
    </div>`;
  openSheet(ttl, body);
  const get=()=>{ const v={}; sheet.querySelectorAll("[data-k]").forEach(el=>v[el.dataset.k]=el.value); return v; };
  document.getElementById("pCancel").onclick=closeSheet;
  document.getElementById("pSave").onclick=async()=>{ const v=get(); closeSheet(); try{ const {error}=await sb.from("progress").update({session_date:v.session_date,content:v.content}).eq("id",id); if(error)throw error; toast("已儲存"); await reload(); }catch(err){ toast("錯誤:"+err.message); } };
  document.getElementById("pDel").onclick=async()=>{ if(!confirm("刪除這筆下一堂?"))return; closeSheet(); try{ const {error}=await sb.from("progress").delete().eq("id",id); if(error)throw error; toast("已刪除"); await reload(); }catch(err){ toast("錯誤:"+err.message); } };
  document.getElementById("pDone").onclick=async()=>{ const v=get(); closeSheet();
    try{ const {error}=await sb.from("progress").update({session_date:v.session_date,content:v.content,kind:"done"}).eq("id",id); if(error)throw error; toast("已完成 ✓"); await reload();
      askNext(e.school,e.class_name,e.track,addDays(v.session_date,7));
    }catch(err){ toast("錯誤:"+err.message); } };
}
/* 完成後：詢問下一堂內容 */
function askNext(school,class_name,track,defDate){
  formSheet("下一堂要上什麼？（可留空之後再排）",[
    {key:"session_date",label:"預計日期",type:"date",value:defDate},
    {key:"content",label:"預計上課內容",type:"textarea",value:""},
  ],async v=>{ if(!(v.content||"").trim()){ toast("已完成（未排下一堂）"); return; }
    const {error}=await sb.from("progress").insert({school,class_name,track:track||null,session_date:v.session_date,content:v.content,kind:"planned"}); if(error)throw error; toast("已排下一堂"); await reload(); });
}

/* ===== Sheet / Form / Toast ===== */
const backdrop=document.getElementById("backdrop"), sheet=document.getElementById("sheet");
function openSheet(title,html){ sheet.innerHTML=`<h3>${title}</h3>${html}`; backdrop.classList.add("on"); sheet.classList.add("on"); }
function closeSheet(){ backdrop.classList.remove("on"); sheet.classList.remove("on"); }
backdrop.onclick=closeSheet;
function formSheet(title,fields,onSave,onDelete){
  const body=fields.map(f=>{
    if(f.type==="select"){ const o=f.options.map(op=>`<option value="${op}" ${op===f.value?"selected":""}>${f.labels?f.labels[op]:op}</option>`).join(""); return `<div class="field"><label>${f.label}</label><select data-k="${f.key}">${o}</select></div>`; }
    if(f.type==="textarea"){ return `<div class="field"><label>${f.label}</label><textarea data-k="${f.key}">${f.value||""}</textarea></div>`; }
    return `<div class="field"><label>${f.label}</label><input type="${f.type}" data-k="${f.key}" value="${f.value??""}"></div>`;
  }).join("");
  openSheet(title, body+`<div class="sheet-actions">${onDelete?'<button class="danger" id="fDel">刪除</button>':''}<button id="fCancel">取消</button><button class="primary" id="fSave">儲存</button></div>`);
  document.getElementById("fCancel").onclick=closeSheet;
  document.getElementById("fSave").onclick=async()=>{ const v={}; sheet.querySelectorAll("[data-k]").forEach(el=>v[el.dataset.k]=el.value); closeSheet(); try{ await onSave(v); }catch(e){ toast("錯誤:"+e.message); } };
  if(onDelete)document.getElementById("fDel").onclick=async()=>{ if(!confirm("確定刪除?"))return; closeSheet(); try{ await onDelete(); }catch(e){ toast("錯誤:"+e.message); } };
}
let toastT; function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1800); }

/* ===== 導覽 ===== */
function switchTab(p){ curTab=p; document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.p===p)); document.querySelectorAll(".panel").forEach(pn=>pn.classList.remove("on")); document.getElementById("p-"+p).classList.add("on"); }
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>switchTab(t.dataset.p));
document.getElementById("prevM").onclick=()=>{const i=viewY*12+viewM-1;viewY=Math.floor((i-1)/12);viewM=((i-1)%12)+1;renderCalendar();};
document.getElementById("nextM").onclick=()=>{const i=viewY*12+viewM+1;viewY=Math.floor((i-1)/12);viewM=((i-1)%12)+1;renderCalendar();};
document.getElementById("todayM").onclick=()=>{const t=new Date();let i=t.getFullYear()*12+t.getMonth()+1;const MIN=2026*12+7,MAX=2027*12+6;i=Math.max(MIN,Math.min(MAX,i));viewY=Math.floor((i-1)/12);viewM=((i-1)%12)+1;renderCalendar();};
const semSel=document.getElementById("semSel");
semSel.onchange=()=>{ curSem=DB.semesters.find(s=>s.code===semSel.value); renderSalary(); const [y,m]=curSem.start_date.split("-").map(Number); viewY=y;viewM=m; renderCalendar(); };

/* ===== 全部重繪 + 啟動 ===== */
/* ===== 上課錄音 ===== */
const escRec = s => String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function recBadge(s){
  const map={uploaded:["待處理","--warn"],processing:["處理中…","--accent"],done:["完成","--good"],error:["失敗","--crit"]};
  const [t,c]=map[s]||["—","--ink-faint"];
  return `<span style="font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:20px;color:var(${c});background:color-mix(in srgb,var(${c}) 14%,var(--surface));border:1px solid color-mix(in srgb,var(${c}) 35%,transparent)">${t}</span>`;
}
function eligibleSessions(){
  const t=new Date();
  const today=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
  const uploaded=new Set((DB.recordings||[]).map(r=>`${r.class_date}|${r.class_label}`));
  const seen=new Set(); const out=[];
  (DB.sessions||[]).filter(s=>s.status!=="cancelled"&&s.date<=today)
    .sort((a,b)=>b.date.localeCompare(a.date))
    .forEach(s=>{ const label=`${s.school} ${s.class_name}`; const k=`${s.date}|${label}`;
      if(seen.has(k)||uploaded.has(k))return; seen.add(k); out.push({date:s.date,label}); });
  return out;
}
function fillSessionSelect(){
  const sel=document.getElementById("recSession"); if(!sel)return;
  const list=eligibleSessions();
  sel.innerHTML=list.length
    ? list.map(x=>`<option value="${x.date}|${x.label}">${mdLabel(x.date)} · ${x.label}</option>`).join("")
    : `<option value="">（目前沒有待上傳的課堂）</option>`;
}
function renderRecordings(){
  fillSessionSelect();
  const el=document.getElementById("recBody");
  const rows=(DB.recordings||[]).slice().sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""));
  if(!rows.length){ el.innerHTML=`<div class="empty">還沒有錄音。上面選音檔上傳試試。</div>`; return; }
  el.innerHTML=rows.map(r=>{
    const title=`${r.class_date?mdLabel(r.class_date):"（未填日期）"}${r.class_label?" · "+escRec(r.class_label):""}`;
    let body="";
    if(r.status==="done"){
      body=`<details style="margin-top:6px"><summary style="cursor:pointer;font-weight:700;color:var(--accent);padding:4px 0">📝 上課筆記與教學回饋</summary>`+
        (r.notes?`<div style="margin-top:8px"><b>上課筆記</b><div style="white-space:pre-wrap;font-size:.9rem;line-height:1.55;margin-top:3px">${escRec(r.notes)}</div></div>`:"")+
        (r.feedback?`<div style="margin-top:12px"><b>教學回饋</b><div style="white-space:pre-wrap;font-size:.9rem;line-height:1.55;margin-top:3px">${escRec(r.feedback)}</div></div>`:"")+
        `</details>`;
    } else if(r.status==="error"){
      body=`<div style="color:var(--crit);font-size:.82rem;margin-top:5px">${escRec(r.error_msg||"處理失敗")}</div>`;
    } else if(r.status==="processing"){
      body=`<div style="color:var(--ink-faint);font-size:.82rem;margin-top:5px">電腦正在轉文字＋整理中…</div>`;
    } else {
      body=`<div style="color:var(--ink-faint);font-size:.82rem;margin-top:5px">已上傳，等電腦的監看程式處理。</div>`;
    }
    return `<div class="note-card"><div class="nmeta" style="display:flex;justify-content:space-between;align-items:center"><span>${title}</span>${recBadge(r.status)}</div>${body}<button class="ib" style="margin-top:8px" onclick="delRecording(${r.id})">🗑️ 刪除</button></div>`;
  }).join("");
}
async function uploadRecording(){
  const btn=document.getElementById("recUpload");
  const file=document.getElementById("recFile").files[0];
  const sel=document.getElementById("recSession").value;
  const msg=document.getElementById("recMsg");
  if(!sel){ msg.textContent="目前沒有待上傳的課堂可選。"; return; }
  if(!file){ msg.textContent="請先選一個音檔。"; return; }
  const [date,label]=sel.split("|");
  const mb=(file.size/1048576).toFixed(0);
  btn.disabled=true; const old=btn.textContent; btn.textContent="上傳中…";
  msg.textContent=`上傳中（約 ${mb} MB），檔案大請耐心等，不要關掉頁面…`;
  try{
    const safe=file.name.replace(/[^\w.\-]/g,"_");
    const path=`${date||"nodate"}/${Date.now()}_${safe}`;
    const up=await sb.storage.from("recordings").upload(path,file,{contentType:file.type||"audio/mp4"});
    if(up.error) throw up.error;
    const ins=await sb.from("recordings").insert({class_date:date,class_label:label,audio_filename:path,status:"uploaded"});
    if(ins.error) throw ins.error;
    msg.textContent="✅ 上傳完成！電腦會自動處理，稍後回來看筆記。";
    document.getElementById("recFile").value="";
    await reload();
  }catch(e){ msg.textContent="錯誤："+(e.message||e); }
  finally{ btn.disabled=false; btn.textContent=old; }
}
async function delRecording(id){
  if(!confirm("刪除這筆錄音紀錄?"))return;
  const r=(DB.recordings||[]).find(x=>x.id===id);
  try{ if(r&&r.audio_filename) await sb.storage.from("recordings").remove([r.audio_filename]); }catch(e){}
  const {error}=await sb.from("recordings").delete().eq("id",id);
  if(error)return toast("錯誤:"+error.message);
  toast("已刪除"); await reload();
}
document.getElementById("recUpload").onclick=uploadRecording;

function renderAll(){ renderCalendar(); renderSalary(); renderProgress(); renderSched(); renderNotes(); renderRecordings(); renderLegend(document.getElementById("legend"),DB.schools.map(s=>s.name)); }
(async()=>{
  try{
    await loadAll();
    curSem=DB.semesters[0];
    semSel.innerHTML=DB.semesters.map(s=>`<option value="${s.code}">${s.label}</option>`).join("");
    const now=new Date(); if(now.getFullYear()===2026&&now.getMonth()+1>=7){viewY=2026;viewM=now.getMonth()+1;}
    renderAll(); switchTab("cal");
    document.getElementById("loading").style.display="none";
    document.getElementById("app").style.display="block";
  }catch(e){
    document.getElementById("loading").innerHTML=`<div style="max-width:420px"><b>載入失敗</b><br><br>${e.message}<br><br>把這段截圖給 Claude。</div>`;
    console.error(e);
  }
})();
</script>
