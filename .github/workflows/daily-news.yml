name: Daily News

on:
  schedule:
    # 12:00 Asia/Taipei every day (04:00 UTC). GitHub cron uses UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-news:
    name: Fetch and save news
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_NEWS_URL: https://pytmyuuoerhrsytwjtbq.supabase.co/rest/v1/news
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_l4cGpyjxQua5ICikOiGqqw_s-_gYVnB
      NEWS_TIME_ZONE: Asia/Taipei
      NEWS_LOOKBACK_DAYS: "14"
      NEWS_MAX_CANDIDATE_AGE_DAYS: "16"
      NEWS_CANDIDATES: "45"
      NEWS_TARGET_ITEMS: "8"
      NEWS_MAX_PER_SOURCE: "6"
      NEWS_MAX_PER_TOPIC: "4"
      DELETE_NEWS_OLDER_THAN_DAYS: "16"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch RSS, summarize, and insert news
        run: npm run fetch-news

      # Keep-alive: runs even if the news step failed (if: always()).
      # 1) Daily Supabase request -> project never hits 7-day inactivity pause.
      # 2) Weekly heartbeat commit -> repo stays active so GitHub never
      #    auto-disables this scheduled workflow (60-day inactivity rule).
      - name: Keep-alive (DB active + schedule alive)
        if: always()
        run: |
          echo "Pinging Supabase to keep the project active..."
          curl -s -o /dev/null -w "supabase ping: HTTP %{http_code}\n" \
            "${SUPABASE_NEWS_URL}?select=id&limit=1" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" || echo "ping failed (non-fatal)"

          mkdir -p .github
          echo "last keep-alive week: $(date -u +%G-W%V)  (updated $(date -u +%Y-%m-%dT%H:%M:%SZ) UTC)" > .github/keepalive.txt
          git add .github/keepalive.txt
          if git diff --cached --quiet; then
            echo "Heartbeat unchanged this week - no commit needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: weekly keep-alive heartbeat"
            git push && echo "Heartbeat committed." || echo "push failed (non-fatal)"
          fi
