name: Daily News

on:
  schedule:
    # 07:00 Asia/Taipei every day. GitHub cron uses UTC.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-news:
    name: Fetch and save news
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_NEWS_URL: https://pytmyuuoerhrsytwjtbq.supabase.co/rest/v1/news
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_l4cGpyjxQua5ICikOiGqqw_s-_gYVnB
      NEWS_TIME_ZONE: Asia/Taipei
      NEWS_LOOKBACK_DAYS: "4"
      NEWS_MAX_CANDIDATE_AGE_DAYS: "21"
      NEWS_CANDIDATES: "18"
      NEWS_TARGET_ITEMS: "6"
      NEWS_MAX_PER_SOURCE: "4"
      NEWS_MAX_PER_TOPIC: "3"
      DELETE_NEWS_OLDER_THAN_DAYS: "30"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch RSS, summarize, and insert news
        run: npm run fetch-news
