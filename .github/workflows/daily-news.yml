name: Daily News

on:
  schedule:
    # 07:00 Asia/Taipei every day. GitHub cron uses UTC.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  fetch-news:
    name: Fetch and save news
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_MODELS_MODEL: openai/gpt-4o-mini
      SUPABASE_NEWS_URL: https://pytmyuuoerhrsytwjtbq.supabase.co/rest/v1/news
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_l4cGpyjxQua5ICikOiGqqw_s-_gYVnB
      NEWS_TIME_ZONE: Asia/Taipei
      NEWS_LOOKBACK_DAYS: "2"
      NEWS_CANDIDATES: "12"
      NEWS_TARGET_ITEMS: "5"
      DELETE_NEWS_OLDER_THAN_DAYS: "30"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch RSS, summarize, and insert news
        run: npm run fetch-news
